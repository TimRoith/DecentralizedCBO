d: 1000
total_particles: 160
num_nodes: 8

max_query_budget: 1000000000000
max_it: 20000
n_seeds: 10

success_thresh: 1.0e-4
track_history: false

shift_optimum: true

problems:
  - name: rastrigin

  - name: styblinski_tang
  - name: lunacek

cbo_kwargs:
  dt: 0.2
  sigma: 1.5
  alpha: 1.0e-4
  noise: anisotropic
  f_dim: '3D'
  verbosity: 0

scheduler:
  name: multiply
  factor: 1.05
  maximum: 1.0e+9

resampling:
  criteria:
    - {name: loss_update, wait_thresh: 50}
  sigma_indep: 0.01

methods:
  - name: serial
    resampling: {criteria: [{name: loss_update, wait_thresh: 50}], sigma_indep: 0.01}

  - name: decentralized
    label: decentralized_ring_many_particles
    total_particles: 1280
    num_nodes: 8
    mixing: {name: ring, lam: 0.5}
    compute_z_mode: tracking
    resampling: {criteria: [{name: loss_update, wait_thresh: 50}], sigma_indep: 0.01}

  - name: cma
    label: sep_cma_best_of_8
    cma_kwargs: {noise_handling: false, diagonal: true, n_restarts: 8}
