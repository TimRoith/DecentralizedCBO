d: 100
total_particles: 160
num_nodes: 8

max_query_budget: 1000000000000
max_it: 5000
n_seeds: 10

success_thresh: 10.0
track_history: false

problems:
  - {name: rastrigin, label: rastrigin_d100, d: 20}

sweep:
  base: {name: decentralized, compute_z_mode: tracking}
  N:            [10, 20, 40]
  sigma:        [0.1, 2.5]
  num_nodes:    [1, 2, 4, 8, 16, 32]
  mixing_name:  [identity, ring, ring_2hop, star, full]

plot:
  x: num_nodes
  line: mixing_name
  col: N
  row: sigma

cbo_kwargs:
  dt: 0.05
  sigma: 2.5
  alpha: 1.0e-4
  noise: anisotropic
  f_dim: '3D'
  verbosity: 0

scheduler:
  name: multiply
  factor: 1.05
  maximum: 1.0e+9
